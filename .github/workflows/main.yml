name: Main

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Core Ruby 4.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rake

  minitest-compatibility:
    name: Minitest ${{ matrix.minitest }} on Ruby 4.0
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minitest: ["5.26.2", "6.0.0", "6.0.6"]
    env:
      BRANCHPROOF_MINITEST_VERSION: ${{ matrix.minitest }}
      BUNDLE_FROZEN: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: false
      - run: bundle update minitest
      - name: Verify resolved Minitest version
        env:
          EXPECTED_MINITEST_VERSION: ${{ matrix.minitest }}
        run: >-
          bundle exec ruby -rminitest -e 'actual = Gem.loaded_specs.fetch("minitest").version.to_s; expected = ENV.fetch("EXPECTED_MINITEST_VERSION"); abort "unexpected Minitest #{actual}" unless actual == expected'
      - name: Run Minitest compatibility acceptance suites
        run: >-
          bundle exec ruby -Itest -e 'files = ARGV.dup; ARGV.clear; files.each { |file| require File.expand_path(file) }'
          test/test_minitest_adapter.rb
          test/test_cli_acceptance.rb
          test/test_minitest_compatibility.rb
          test/test_doctor_acceptance.rb
          test/test_collation_acceptance.rb
          test/test_optional_frameworks.rb

  rspec-compatibility:
    name: RSpec core ${{ matrix.rspec_core }} on Ruby 4.0
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rspec_core: ["3.13.0", "3.13.6"]
    env:
      BRANCHPROOF_RSPEC_CORE_VERSION: ${{ matrix.rspec_core }}
      BUNDLE_FROZEN: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: false
      - run: bundle update rspec rspec-core
      - name: Verify resolved RSpec Core version
        env:
          EXPECTED_RSPEC_CORE_VERSION: ${{ matrix.rspec_core }}
        run: >-
          bundle exec ruby -rrspec/core/version -e 'abort "unexpected RSpec core #{RSpec::Core::Version::STRING}" unless RSpec::Core::Version::STRING == ENV.fetch("EXPECTED_RSPEC_CORE_VERSION")'
      - run: bundle exec rake test

  rails-integration:
    name: Rails 8.1 on Ruby 4.0
    runs-on: ubuntu-latest
    env:
      BRANCHPROOF_RAILS_INTEGRATION: "1"
      # This job adds optional Rails dependencies to the core bundle.
      BUNDLE_FROZEN: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          cache-version: rails-integration
      - run: bundle exec rake test

  rspec-rails-integration:
    name: RSpec Rails 8.1 on Ruby 4.0
    runs-on: ubuntu-latest
    env:
      BRANCHPROOF_RSPEC_RAILS_INTEGRATION: "1"
      BUNDLE_FROZEN: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          cache-version: rspec-rails-integration
      - run: bundle exec rake test
