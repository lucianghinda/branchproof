    - "lib/branchproof/decision_syntax.rb"
    # Decision-table derivation and its constraint model stay in one readable
    # unit so the logical semantics remain inspectable end to end.
    - "lib/branchproof/decision_table.rb"
    - "lib/branchproof/constraints.rb"
    - "test/**/*"
    - "lib/branchproof/runtime.rb"

