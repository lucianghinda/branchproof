AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"
    # These demonstrate Ruby syntax that style cops would remove or rewrite.
    # test_ruby_construct_examples.rb checks syntax and behavior instead.
    - "test/fixtures/ruby_constructs/**/*.rb"

Layout/LineLength:
  Max: 120
  Exclude:
    - "test/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Metrics/BlockLength:
  Exclude:
    - "test/**/*"
    # Snapshot/report assembly is intentionally kept together for auditability.
    - "lib/branchproof/evidence.rb"

Metrics/AbcSize:
  Exclude:
    - "test/**/*"
    # Inventory/reporting code is deliberately record-oriented and bounded.
    - "lib/branchproof/source.rb"
    - "lib/branchproof/constraints.rb"
    - "lib/branchproof/decision_table.rb"
    - "lib/branchproof/decision_syntax.rb"
    - "lib/branchproof/report.rb"
    - "lib/branchproof/evidence.rb"
    - "lib/branchproof/records.rb"
    - "lib/branchproof/limits.rb"
    - "lib/branchproof/runtime.rb"
    # Analyzer, adapters, and bounded search/rewriting algorithms keep their
    # state transitions together so the decision semantics remain inspectable.
    - "lib/branchproof/analyzer.rb"
    - "lib/branchproof/cli.rb"
    - "lib/branchproof/instrumenter.rb"
    - "lib/branchproof/loader.rb"
    - "lib/branchproof/minimizer.rb"
    - "lib/branchproof/minitest_adapter.rb"
    - "lib/branchproof/rspec_adapter.rb"
    - "lib/branchproof/worker.rb"

